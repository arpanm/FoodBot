apiVersion: v2
name: foodbot
description: A Helm chart for FoodBot - Agentic Restaurant Commerce Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - foodbot
  - restaurant
  - commerce
  - microservices
home: https://github.com/your-org/foodbot
sources:
  - https://github.com/your-org/foodbot
maintainers:
  - name: FoodBot Team
    email: devops@foodbot.com
dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: kafka
    version: "26.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  - name: elasticsearch
    version: "19.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: elasticsearch.enabled
