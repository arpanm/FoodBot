# ============================================
# Nginx Load Balancer Configuration
# Production-ready with:
# - Load balancing across multiple backend instances
# - SSL/TLS termination
# - Gzip compression
# - Static file caching
# - Rate limiting
# - Security headers
# - WebSocket support
# ============================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 100000;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================
    # Logging Configuration
    # ============================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format detailed '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time" '
                       'upstream="$upstream_addr" cache="$upstream_cache_status"';

    access_log /var/log/nginx/access.log detailed;

    # ============================================
    # Performance Optimization
    # ============================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    reset_timedout_connection on;
    client_body_timeout 30;
    send_timeout 30;

    # Buffer sizes
    client_body_buffer_size 128k;
    client_max_body_size 10m;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    output_buffers 1 32k;
    postpone_output 1460;

    # Hash sizes
    types_hash_max_size 2048;
    server_names_hash_bucket_size 64;

    # ============================================
    # Gzip Compression
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        application/xhtml+xml
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject
        application/font-woff
        application/font-woff2;
    gzip_disable "msie6";

    # ============================================
    # Security Headers (Global Defaults)
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Disable version disclosure
    server_tokens off;
    more_clear_headers Server;

    # ============================================
    # Rate Limiting Zones
    # ============================================
    # Limit requests per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/s;

    # Limit connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Rate limit status
    limit_req_status 429;
    limit_conn_status 429;

    # ============================================
    # Upstream Backend Pools
    # ============================================
    # Gateway API - Load balanced across 3 instances
    upstream gateway_backend {
        least_conn;
        keepalive 32;

        server gateway-api-1:3000 max_fails=3 fail_timeout=30s;
        server gateway-api-2:3000 max_fails=3 fail_timeout=30s;
        server gateway-api-3:3000 max_fails=3 fail_timeout=30s;
    }

    # Search Orchestrator
    upstream search_backend {
        server search-orchestrator:3002 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # Customer App
    upstream customer_app {
        server customer-app:8080 max_fails=2 fail_timeout=30s;
    }

    # Restaurant App
    upstream restaurant_app {
        server restaurant-app:8081 max_fails=2 fail_timeout=30s;
    }

    # ============================================
    # Cache Configuration
    # ============================================
    proxy_cache_path /var/cache/nginx/api
                     levels=1:2
                     keys_zone=api_cache:10m
                     max_size=1g
                     inactive=60m
                     use_temp_path=off;

    proxy_cache_path /var/cache/nginx/static
                     levels=1:2
                     keys_zone=static_cache:10m
                     max_size=2g
                     inactive=7d
                     use_temp_path=off;

    # ============================================
    # Include Server Configurations
    # ============================================
    include /etc/nginx/conf.d/*.conf;
}
