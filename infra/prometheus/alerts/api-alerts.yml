# ============================================
# Prometheus Alert Rules
# API and Service Alerts
# ============================================

groups:
  - name: api_alerts
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m])
          / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High error rate detected"
          description: "{{ $labels.job }} has error rate > 5% (current: {{ $value | humanizePercentage }})"

      # High response time
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 0.5
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API response time"
          description: "{{ $labels.job }} p95 response time > 500ms (current: {{ $value }}s)"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Service is down"
          description: "{{ $labels.job }} has been down for more than 2 minutes"

      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High CPU usage"
          description: "{{ $labels.instance }} CPU usage > 80% (current: {{ $value }}%)"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes)
          / node_memory_MemTotal_bytes * 100 > 85
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: "High memory usage"
          description: "{{ $labels.instance }} memory usage > 85% (current: {{ $value }}%)"

      # Database connection pool exhaustion
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "PostgreSQL connection pool > 80% full (current: {{ $value | humanizePercentage }})"

      # Redis high memory usage
      - alert: RedisHighMemoryUsage
        expr: |
          redis_memory_used_bytes / redis_memory_max_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis memory usage high"
          description: "Redis memory usage > 85% (current: {{ $value | humanizePercentage }})"

      # Kafka lag
      - alert: KafkaConsumerLag
        expr: |
          kafka_consumergroup_lag > 1000
        for: 10m
        labels:
          severity: warning
          component: messaging
        annotations:
          summary: "High Kafka consumer lag"
          description: "Consumer {{ $labels.consumergroup }} has lag > 1000 messages (current: {{ $value }})"

      # Elasticsearch cluster health
      - alert: ElasticsearchClusterNotHealthy
        expr: elasticsearch_cluster_health_status != 1
        for: 5m
        labels:
          severity: critical
          component: search
        annotations:
          summary: "Elasticsearch cluster not healthy"
          description: "Elasticsearch cluster status is not green"

      # Too many pods pending
      - alert: TooManyPodsPending
        expr: |
          sum(kube_pod_status_phase{phase="Pending"}) > 5
        for: 5m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Too many pods pending"
          description: "More than 5 pods are pending (current: {{ $value }})"

      # Deployment rollout stuck
      - alert: DeploymentRolloutStuck
        expr: |
          kube_deployment_status_observed_generation != kube_deployment_metadata_generation
        for: 15m
        labels:
          severity: warning
          component: kubernetes
        annotations:
          summary: "Deployment rollout stuck"
          description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} rollout is stuck"
