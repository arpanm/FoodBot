# Logstash Pipeline Configuration for FoodBot
#
# This pipeline receives logs from multiple sources:
# - TCP/UDP on port 5000 (application logs)
# - Beats on port 5044 (Filebeat)
# - HTTP on port 8080 (webhook logs)

input {
  # TCP input for application logs
  tcp {
    port => 5000
    codec => json_lines
    tags => ["tcp"]
  }

  # UDP input for high-volume logs
  udp {
    port => 5000
    codec => json_lines
    tags => ["udp"]
  }

  # Beats input for Filebeat
  beats {
    port => 5044
    tags => ["beats"]
  }

  # HTTP input for webhook logs
  http {
    port => 8080
    codec => json
    tags => ["http"]
  }
}

filter {
  # Parse JSON logs
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
      target => "parsed"
    }

    # Promote parsed fields to top level
    if [parsed] {
      mutate {
        rename => {
          "[parsed][level]" => "log_level"
          "[parsed][timestamp]" => "app_timestamp"
          "[parsed][correlationId]" => "correlation_id"
          "[parsed][service]" => "service_name"
          "[parsed][userId]" => "user_id"
          "[parsed][error]" => "error_details"
          "[parsed][duration]" => "duration_ms"
          "[parsed][statusCode]" => "http_status"
          "[parsed][method]" => "http_method"
          "[parsed][path]" => "http_path"
        }
      }
    }
  }

  # Parse timestamp
  if [app_timestamp] {
    date {
      match => ["app_timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }

  # Add environment
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:development}"
      "application" => "foodbot"
    }
  }

  # Categorize log levels
  if [log_level] {
    mutate {
      lowercase => ["log_level"]
    }

    if [log_level] == "error" or [log_level] == "fatal" {
      mutate {
        add_tag => ["error"]
      }
    } else if [log_level] == "warn" {
      mutate {
        add_tag => ["warning"]
      }
    }
  }

  # Extract HTTP metrics
  if [http_status] {
    if [http_status] >= 500 {
      mutate {
        add_tag => ["http_5xx", "error"]
      }
    } else if [http_status] >= 400 {
      mutate {
        add_tag => ["http_4xx", "client_error"]
      }
    } else if [http_status] >= 200 and [http_status] < 300 {
      mutate {
        add_tag => ["http_success"]
      }
    }
  }

  # Performance tagging
  if [duration_ms] {
    ruby {
      code => "
        duration = event.get('duration_ms')
        if duration > 5000
          event.tag('very_slow')
        elsif duration > 1000
          event.tag('slow')
        elsif duration > 500
          event.tag('moderate')
        end
      "
    }
  }

  # Security event detection
  if [message] =~ /(?i)(unauthorized|forbidden|authentication failed|invalid token)/ {
    mutate {
      add_tag => ["security_event"]
    }
  }

  # Database query logging
  if [message] =~ /(?i)(SELECT|INSERT|UPDATE|DELETE)/ {
    mutate {
      add_tag => ["database_query"]
    }
  }

  # Job processing logs
  if [service_name] == "job-processor" {
    mutate {
      add_tag => ["job_processing"]
    }

    if [message] =~ /(?i)(job completed|job failed)/ {
      grok {
        match => {
          "message" => "Job %{WORD:job_status}: %{GREEDYDATA:job_details}"
        }
      }
    }
  }

  # Payment processing logs
  if [message] =~ /(?i)(payment|transaction|charge|refund)/ {
    mutate {
      add_tag => ["payment", "sensitive"]
    }

    # Mask sensitive payment data
    mutate {
      gsub => [
        "message", "cardNumber=[0-9]{12,19}", "cardNumber=****",
        "message", "cvv=[0-9]{3,4}", "cvv=***"
      ]
    }
  }

  # Remove parsed field to reduce storage
  if [parsed] {
    mutate {
      remove_field => ["parsed"]
    }
  }

  # Geo-IP enrichment (if IP address present)
  if [client_ip] {
    geoip {
      source => "client_ip"
      target => "geo"
    }
  }

  # User agent parsing
  if [user_agent] {
    useragent {
      source => "user_agent"
      target => "ua"
    }
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "foodbot-logs-%{+YYYY.MM.dd}"

    # Use different indices for different log types
    ilm_enabled => false

    # Template for index mappings
    template_name => "foodbot-logs"
    template_overwrite => true
  }

  # Output errors to separate index
  if "error" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "foodbot-errors-%{+YYYY.MM.dd}"
    }
  }

  # Output security events to separate index
  if "security_event" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "foodbot-security-%{+YYYY.MM.dd}"
    }
  }

  # Output performance metrics
  if "slow" in [tags] or "very_slow" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "foodbot-performance-%{+YYYY.MM.dd}"
    }
  }

  # Debug output (only in development)
  if "${ENVIRONMENT:development}" == "development" {
    stdout {
      codec => rubydebug
    }
  }

  # Send critical errors to alerting system
  if "error" in [tags] and [log_level] == "error" {
    # Placeholder for alerting integration
    # http {
    #   url => "https://alerting-service/webhook"
    #   http_method => "post"
    #   format => "json"
    # }
  }
}
