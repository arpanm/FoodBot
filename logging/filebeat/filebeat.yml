# Filebeat Configuration for FoodBot
#
# Collects logs from files and Docker containers

filebeat.inputs:
  # Application log files
  - type: log
    enabled: true
    paths:
      - /var/log/foodbot/*.log
      - /var/log/foodbot/**/*.log
    fields:
      service: foodbot
      log_source: file
    fields_under_root: true
    json.keys_under_root: true
    json.add_error_key: true
    multiline.pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
    multiline.negate: true
    multiline.match: after

  # Docker container logs
  - type: container
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*.log
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true

  # Gateway API logs
  - type: log
    enabled: true
    paths:
      - /var/log/foodbot/gateway-api/*.log
    fields:
      service: gateway-api
      service_type: backend
    fields_under_root: true

  # Customer App logs
  - type: log
    enabled: true
    paths:
      - /var/log/foodbot/customer-app/*.log
    fields:
      service: customer-app
      service_type: frontend
    fields_under_root: true

  # Chrome Extension logs
  - type: log
    enabled: true
    paths:
      - /var/log/foodbot/chrome-extension/*.log
    fields:
      service: chrome-extension
      service_type: extension
    fields_under_root: true

# Processors
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_cloud_metadata: ~
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~

# Output to Logstash
output.logstash:
  hosts: ["logstash:5044"]
  compression_level: 3
  bulk_max_size: 2048
  loadbalance: true

# Output directly to Elasticsearch (alternative)
# output.elasticsearch:
#   hosts: ["elasticsearch:9200"]
#   index: "filebeat-foodbot-%{+yyyy.MM.dd}"

# Logging
logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

# Monitoring
monitoring.enabled: true
monitoring.elasticsearch.hosts: ["elasticsearch:9200"]
