# =============================================================================
# FoodBot - Continuous Deployment to Staging
# =============================================================================
# Deploys to staging environment on push to develop branch
# Runs smoke tests and health checks after deployment
# =============================================================================

name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip smoke tests'
        required: false
        default: false
        type: boolean

concurrency:
  group: staging-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ---------------------------------------------------------------------------
  # Build and Push Docker Images
  # ---------------------------------------------------------------------------
  build-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          TAG="staging-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}"
          echo "tags=${REGISTRY}/${IMAGE_PREFIX}:${TAG}" >> $GITHUB_OUTPUT
          echo "version=${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/gateway-api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:cache,mode=max
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/customer-app/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:cache,mode=max
          build-args: |
            NODE_VERSION=${{ env.NODE_VERSION }}

      - name: Build and push MCP Orchestrator image
        uses: docker/build-push-action@v5
        with:
          context: ./services/mcp-orchestrator
          file: ./services/mcp-orchestrator/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mcp:${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mcp:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mcp:cache,mode=max
          build-args: |
            JAVA_VERSION=${{ env.JAVA_VERSION }}

      - name: Build and push Search Orchestrator image
        uses: docker/build-push-action@v5
        with:
          context: ./services/search-orchestrator
          file: ./services/search-orchestrator/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/search:${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/search:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/search:cache,mode=max

      - name: Build and push MCP Adapter image
        uses: docker/build-push-action@v5
        with:
          context: ./services/mcp-adapter
          file: ./services/mcp-adapter/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/adapter:${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/adapter:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/adapter:cache,mode=max

  # ---------------------------------------------------------------------------
  # Deploy to Staging (Kubernetes)
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images]
    environment:
      name: staging
      url: https://staging.foodbot.dev
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update deployment manifests
        run: |
          IMAGE_TAG="${{ needs.build-images.outputs.version }}"

          # Update backend deployment
          kubectl set image deployment/foodbot-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:${IMAGE_TAG} \
            -n foodbot-staging

          # Update frontend deployment
          kubectl set image deployment/foodbot-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:${IMAGE_TAG} \
            -n foodbot-staging

          # Update MCP orchestrator
          kubectl set image deployment/foodbot-mcp \
            mcp=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mcp:${IMAGE_TAG} \
            -n foodbot-staging

          # Update search orchestrator
          kubectl set image deployment/foodbot-search \
            search=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/search:${IMAGE_TAG} \
            -n foodbot-staging

          # Update MCP adapter
          kubectl set image deployment/foodbot-adapter \
            adapter=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/adapter:${IMAGE_TAG} \
            -n foodbot-staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/foodbot-backend -n foodbot-staging --timeout=5m
          kubectl rollout status deployment/foodbot-frontend -n foodbot-staging --timeout=5m
          kubectl rollout status deployment/foodbot-mcp -n foodbot-staging --timeout=5m
          kubectl rollout status deployment/foodbot-search -n foodbot-staging --timeout=5m
          kubectl rollout status deployment/foodbot-adapter -n foodbot-staging --timeout=5m

      - name: Run database migrations
        run: |
          kubectl exec -n foodbot-staging deployment/foodbot-backend -- \
            npm run migration:run

  # ---------------------------------------------------------------------------
  # Smoke Tests
  # ---------------------------------------------------------------------------
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: ${{ !inputs.skip_tests }}
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for services to stabilize
        run: sleep 30

      - name: Health check - Backend API
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging-api.foodbot.dev/api/v1/health)
          if [ "$response" != "200" ]; then
            echo "Backend health check failed: HTTP $response"
            exit 1
          fi
          echo "Backend API is healthy"

      - name: Health check - Frontend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging.foodbot.dev/)
          if [ "$response" != "200" ]; then
            echo "Frontend health check failed: HTTP $response"
            exit 1
          fi
          echo "Frontend is healthy"

      - name: Health check - MCP Orchestrator
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://staging-mcp.foodbot.dev/actuator/health)
          if [ "$response" != "200" ]; then
            echo "MCP health check failed: HTTP $response"
            exit 1
          fi
          echo "MCP orchestrator is healthy"

      - name: Smoke test - User authentication
        run: |
          # Register test user
          response=$(curl -s -X POST https://staging-api.foodbot.dev/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"test-'$(date +%s)'@example.com","password":"Test123!@#","name":"Test User"}')

          echo "Registration response: $response"

          # Login
          response=$(curl -s -X POST https://staging-api.foodbot.dev/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@example.com","password":"Test123!@#"}')

          token=$(echo $response | jq -r '.accessToken')
          if [ "$token" == "null" ] || [ -z "$token" ]; then
            echo "Login failed"
            exit 1
          fi
          echo "Authentication smoke test passed"

      - name: Smoke test - Menu API
        run: |
          response=$(curl -s https://staging-api.foodbot.dev/api/v1/menu)
          items=$(echo $response | jq -r '.items | length')
          if [ "$items" -lt 1 ]; then
            echo "Menu API returned no items"
            exit 1
          fi
          echo "Menu API smoke test passed"

  # ---------------------------------------------------------------------------
  # Notify on Success/Failure
  # ---------------------------------------------------------------------------
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-staging, smoke-tests]
    if: always()
    steps:
      - name: Send Slack notification
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          STATUS="${{ needs.smoke-tests.result }}"
          COLOR="good"
          if [ "$STATUS" != "success" ]; then
            COLOR="danger"
          fi

          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d '{
              "attachments": [{
                "color": "'$COLOR'",
                "title": "Staging Deployment",
                "text": "Status: '$STATUS'",
                "fields": [
                  {"title": "Environment", "value": "Staging", "short": true},
                  {"title": "Branch", "value": "${{ github.ref_name }}", "short": true},
                  {"title": "Commit", "value": "${{ github.sha }}", "short": true}
                ]
              }]
            }'
