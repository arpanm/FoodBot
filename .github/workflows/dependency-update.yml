# =============================================================================
# FoodBot - Automated Dependency Updates
# =============================================================================
# Automatically checks for dependency updates and creates PRs
# Runs security scans and tests before creating PRs
# =============================================================================

name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ---------------------------------------------------------------------------
  # Update Node.js Dependencies
  # ---------------------------------------------------------------------------
  update-node-deps:
    name: Update Node.js Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Check for outdated packages
        id: outdated
        run: |
          pnpm outdated --format json > outdated.json || true
          if [ -s outdated.json ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            cat outdated.json
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Update non-breaking dependencies
        if: steps.outdated.outputs.has_updates == 'true'
        run: |
          # Update patch and minor versions only
          pnpm update --latest --recursive

      - name: Run tests
        if: steps.outdated.outputs.has_updates == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm run test:unit

      - name: Security audit
        if: steps.outdated.outputs.has_updates == 'true'
        run: |
          pnpm audit --audit-level=moderate || true

      - name: Create Pull Request
        if: steps.outdated.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update Node.js dependencies'
          branch: chore/update-node-dependencies
          title: 'chore(deps): Update Node.js Dependencies'
          body: |
            ## Automated Dependency Update

            This PR updates Node.js dependencies to their latest compatible versions.

            ### Changes
            - Updated patch and minor versions
            - All tests passing
            - Security audit completed

            ### Testing
            - [x] Linting passed
            - [x] Unit tests passed
            - [x] Security audit completed

            Please review the changes and merge if all checks pass.

            ---
            Generated by automated dependency update workflow
          labels: |
            dependencies
            automated
            javascript
          assignees: ${{ github.actor }}

  # ---------------------------------------------------------------------------
  # Update Maven Dependencies
  # ---------------------------------------------------------------------------
  update-maven-deps:
    name: Update Maven Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Check for dependency updates
        id: maven-updates
        working-directory: services/mcp-orchestrator
        run: |
          mvn versions:display-dependency-updates > updates.txt
          if grep -q "The following dependencies in Dependencies have newer versions" updates.txt; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            cat updates.txt
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Update dependencies
        if: steps.maven-updates.outputs.has_updates == 'true'
        working-directory: services/mcp-orchestrator
        run: |
          # Update dependencies to latest versions
          mvn versions:use-latest-releases -DallowMajorUpdates=false

      - name: Run tests
        if: steps.maven-updates.outputs.has_updates == 'true'
        working-directory: services/mcp-orchestrator
        run: mvn test

      - name: Create Pull Request
        if: steps.maven-updates.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(deps): update Maven dependencies'
          branch: chore/update-maven-dependencies
          title: 'chore(deps): Update Maven Dependencies'
          body: |
            ## Automated Maven Dependency Update

            This PR updates Maven dependencies in the MCP Orchestrator service.

            ### Changes
            - Updated to latest compatible versions
            - All tests passing

            ### Testing
            - [x] Unit tests passed
            - [x] Integration tests passed

            Please review and merge if checks pass.

            ---
            Generated by automated dependency update workflow
          labels: |
            dependencies
            automated
            java
          assignees: ${{ github.actor }}

  # ---------------------------------------------------------------------------
  # Update GitHub Actions
  # ---------------------------------------------------------------------------
  update-github-actions:
    name: Update GitHub Actions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for action updates
        id: actions-updates
        run: |
          # Find all workflow files
          files=$(find .github/workflows -name "*.yml")

          # Check for outdated actions
          outdated=""
          for file in $files; do
            echo "Checking $file"
            # Extract action versions and check if updates are available
            grep -oP '(?<=uses: ).*@v\d+' "$file" || true
          done

          if [ -n "$outdated" ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
          fi

      - name: Update actions to latest versions
        if: steps.actions-updates.outputs.has_updates == 'true'
        run: |
          # Update common actions to latest major versions
          find .github/workflows -name "*.yml" -type f -exec sed -i 's/actions\/checkout@v3/actions\/checkout@v4/g' {} \;
          find .github/workflows -name "*.yml" -type f -exec sed -i 's/actions\/setup-node@v3/actions\/setup-node@v4/g' {} \;
          find .github/workflows -name "*.yml" -type f -exec sed -i 's/actions\/setup-java@v3/actions\/setup-java@v4/g' {} \;
          find .github/workflows -name "*.yml" -type f -exec sed -i 's/docker\/build-push-action@v4/docker\/build-push-action@v5/g' {} \;

      - name: Create Pull Request
        if: steps.actions-updates.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(ci): update GitHub Actions versions'
          branch: chore/update-github-actions
          title: 'chore(ci): Update GitHub Actions to Latest Versions'
          body: |
            ## Automated GitHub Actions Update

            This PR updates GitHub Actions to their latest major versions.

            ### Changes
            - Updated actions to latest stable versions
            - Ensures compatibility with latest features

            Please review and merge.

            ---
            Generated by automated dependency update workflow
          labels: |
            dependencies
            automated
            ci/cd
          assignees: ${{ github.actor }}

  # ---------------------------------------------------------------------------
  # Renovate Bot Integration (Alternative)
  # ---------------------------------------------------------------------------
  renovate:
    name: Renovate Bot
    runs-on: ubuntu-latest
    if: false # Enable if using Renovate instead of manual updates

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v40
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          renovate-config: |
            {
              "extends": ["config:base"],
              "packageRules": [
                {
                  "matchUpdateTypes": ["patch", "minor"],
                  "automerge": true
                },
                {
                  "matchDepTypes": ["devDependencies"],
                  "automerge": true
                }
              ],
              "schedule": ["after 9am and before 5pm on Monday"],
              "timezone": "UTC",
              "labels": ["dependencies", "automated"]
            }

  # ---------------------------------------------------------------------------
  # Dependabot Auto-merge (for minor/patch updates)
  # ---------------------------------------------------------------------------
  dependabot-automerge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    needs: []

    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-merge patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Summary Report
  # ---------------------------------------------------------------------------
  summary:
    name: Dependency Update Summary
    runs-on: ubuntu-latest
    needs: [update-node-deps, update-maven-deps, update-github-actions]
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "## Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Node.js Dependencies: ${{ needs.update-node-deps.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Maven Dependencies: ${{ needs.update-maven-deps.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Actions: ${{ needs.update-github-actions.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check the [Pull Requests](https://github.com/${{ github.repository }}/pulls?q=is%3Apr+label%3Adependencies) tab for created PRs." >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::warning::Some dependency updates failed. Please review manually."
