# =============================================================================
# FoodBot - Continuous Deployment Pipeline (AWS EC2)
# =============================================================================
# Deploys the FoodBot application to an AWS EC2 instance after CI passes.
# Supports manual dispatch, automatic rollback on failure, and Slack
# notifications.
#
# Prerequisites:
#   - EC2 instance provisioned and configured (see docs/AWS_SETUP.md)
#   - GitHub Secrets configured (see docs/GITHUB_SECRETS.md)
#   - Systemd services installed on EC2 (see scripts/systemd/)
#   - Nginx configured on EC2 (see scripts/nginx-foodbot.conf)
# =============================================================================

name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: ['Continuous Integration']
    branches: [main]
    types: [completed]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_health_check:
        description: 'Skip post-deploy health check'
        required: false
        default: false
        type: boolean

env:
  DEPLOY_USER: ${{ secrets.EC2_USER }}
  DEPLOY_HOST: ${{ secrets.EC2_HOST }}
  APP_DIR: /home/${{ secrets.EC2_USER }}/foodbot
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ---------------------------------------------------------------------------
  # Pre-flight checks
  # ---------------------------------------------------------------------------
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Generate release ID
        id: release
        run: echo "id=$(date +%Y%m%d_%H%M%S)_${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Verify required secrets
        run: |
          missing=""
          if [ -z "${{ secrets.EC2_HOST }}" ]; then missing="$missing EC2_HOST"; fi
          if [ -z "${{ secrets.EC2_USER }}" ]; then missing="$missing EC2_USER"; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then missing="$missing SSH_PRIVATE_KEY"; fi
          if [ -z "${{ secrets.AWS_ACCESS_KEY_ID }}" ]; then missing="$missing AWS_ACCESS_KEY_ID"; fi
          if [ -z "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then missing="$missing AWS_SECRET_ACCESS_KEY"; fi
          if [ -z "${{ secrets.AWS_REGION }}" ]; then missing="$missing AWS_REGION"; fi

          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            echo "See docs/GITHUB_SECRETS.md for setup instructions."
            exit 1
          fi

          echo "All required secrets are configured."

  # ---------------------------------------------------------------------------
  # Build all artifacts
  # ---------------------------------------------------------------------------
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    needs: [preflight]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Build backend (NestJS)
        run: pnpm run build

      - name: Build frontend (React)
        working-directory: apps/customer-app
        env:
          REACT_APP_API_URL: ${{ secrets.REACT_APP_API_URL }}
        run: pnpm run build 2>/dev/null || echo "Frontend build not yet configured, skipping"

      - name: Build MCP orchestrator (Spring Boot)
        working-directory: services/mcp-orchestrator
        run: mvn clean package -DskipTests

      - name: Prepare deployment package
        run: |
          RELEASE_ID="${{ needs.preflight.outputs.release_id }}"
          mkdir -p deploy-package

          # Backend artifacts
          if [ -d "dist" ]; then
            cp -r dist deploy-package/backend-dist
          fi

          # Frontend artifacts
          if [ -d "apps/customer-app/build" ]; then
            cp -r apps/customer-app/build deploy-package/frontend-dist
          fi

          # MCP JAR
          mkdir -p deploy-package/mcp-jar
          cp services/mcp-orchestrator/target/*.jar deploy-package/mcp-jar/ 2>/dev/null || true

          # Deployment configuration
          cp package.json deploy-package/
          cp pnpm-lock.yaml deploy-package/
          cp pnpm-workspace.yaml deploy-package/

          # Deployment scripts
          cp -r scripts deploy-package/scripts

          # Create release metadata
          cat > deploy-package/RELEASE.json <<EOF
          {
            "release_id": "$RELEASE_ID",
            "commit_sha": "${{ github.sha }}",
            "commit_message": "$(git log -1 --pretty=%B | head -1)",
            "branch": "${{ github.ref_name }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "built_by": "github-actions"
          }
          EOF

          echo "Deployment package contents:"
          find deploy-package -type f | head -50

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: deploy-package-${{ needs.preflight.outputs.release_id }}
          path: deploy-package/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Deploy to EC2
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [preflight, build]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: https://${{ secrets.PRODUCTION_DOMAIN }}
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: deploy-package-${{ needs.preflight.outputs.release_id }}
          path: ./deploy-package

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create release directory on EC2
        run: |
          RELEASE_ID="${{ needs.preflight.outputs.release_id }}"
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ${{ env.APP_DIR }}/releases/${RELEASE_ID}"

      - name: Copy deployment package to EC2
        run: |
          RELEASE_ID="${{ needs.preflight.outputs.release_id }}"
          scp -i ~/.ssh/deploy_key -r ./deploy-package/* \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.APP_DIR }}/releases/${RELEASE_ID}/

      - name: Copy deployment scripts to EC2
        run: |
          scp -i ~/.ssh/deploy_key \
            ./scripts/deploy.sh \
            ./scripts/rollback.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.APP_DIR }}/

      - name: Execute deployment
        run: |
          RELEASE_ID="${{ needs.preflight.outputs.release_id }}"
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "export RELEASE_ID=${RELEASE_ID} && bash ${{ env.APP_DIR }}/deploy.sh"

      - name: Post-deploy health check
        if: ${{ !inputs.skip_health_check }}
        run: |
          echo "Waiting 30 seconds for services to stabilize..."
          sleep 30

          # Health check - backend API
          echo "Checking backend API health..."
          BACKEND_STATUS=$(ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/health" || echo "000")

          if [ "$BACKEND_STATUS" != "200" ]; then
            echo "::error::Backend health check failed (HTTP $BACKEND_STATUS)"
            exit 1
          fi
          echo "Backend API is healthy (HTTP 200)"

          # Health check - frontend
          echo "Checking frontend health..."
          FRONTEND_STATUS=$(ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "curl -sf -o /dev/null -w '%{http_code}' http://localhost:3001/" || echo "000")

          if [ "$FRONTEND_STATUS" != "200" ]; then
            echo "::warning::Frontend health check returned HTTP $FRONTEND_STATUS"
          else
            echo "Frontend is healthy (HTTP 200)"
          fi

          # Health check - MCP
          echo "Checking MCP orchestrator health..."
          MCP_STATUS=$(ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "curl -sf -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health" || echo "000")

          if [ "$MCP_STATUS" != "200" ]; then
            echo "::warning::MCP health check returned HTTP $MCP_STATUS"
          else
            echo "MCP orchestrator is healthy (HTTP 200)"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ---------------------------------------------------------------------------
  # Rollback on Failure
  # ---------------------------------------------------------------------------
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [deploy]
    if: failure()
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Execute rollback
        run: |
          echo "::warning::Deployment failed. Initiating rollback..."
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "bash ${{ env.APP_DIR }}/rollback.sh"
          echo "Rollback completed."

      - name: Verify rollback health
        run: |
          sleep 20
          BACKEND_STATUS=$(ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000/api/v1/health" || echo "000")

          if [ "$BACKEND_STATUS" == "200" ]; then
            echo "Rollback successful. Backend is healthy."
          else
            echo "::error::Rollback may have failed. Backend returned HTTP $BACKEND_STATUS"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ---------------------------------------------------------------------------
  # Cleanup old releases
  # ---------------------------------------------------------------------------
  cleanup:
    name: Cleanup Old Releases
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success()
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Remove old releases (keep last 5)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ${{ env.APP_DIR }}/releases && ls -t | tail -n +6 | xargs -r rm -rf"
          echo "Old releases cleaned up. Keeping last 5 releases."

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
