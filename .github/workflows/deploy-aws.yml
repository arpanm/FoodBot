name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  PNPM_VERSION: '8'

jobs:
  deploy:
    name: Deploy to ${{  github.event.inputs.environment || 'production'  }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{  github.event.inputs.environment || 'production'  }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{  env.PNPM_VERSION  }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{  env.NODE_VERSION  }}
          cache: 'pnpm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{  env.JAVA_VERSION  }}
          cache: 'maven'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all services
        run: |
          echo "Building backend..."
          pnpm run build

          echo "Building frontend..."
          cd apps/customer-app && pnpm run build && cd ../..

          echo "Building MCP service..."
          cd services/mcp-orchestrator && mvn clean package -DskipTests && cd ../..

      - name: Create deployment package
        run: |
          mkdir -p deploy-package
          cp -r apps/gateway-api/dist deploy-package/backend
          cp -r apps/customer-app/build deploy-package/frontend
          mkdir -p deploy-package/mcp
          cp services/mcp-orchestrator/target/*.jar deploy-package/mcp/
          cp -r scripts deploy-package/
          tar -czf deploy-package.tar.gz deploy-package/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{  secrets.AWS_ACCESS_KEY_ID  }}
          aws-secret-access-key: ${{  secrets.AWS_SECRET_ACCESS_KEY  }}
          aws-region: ${{  secrets.AWS_REGION  }}

      - name: Deploy to EC2
        env:
          SSH_PRIVATE_KEY: ${{  secrets.SSH_PRIVATE_KEY  }}
          EC2_HOST: ${{  secrets.EC2_HOST  }}
          EC2_USER: ${{  secrets.EC2_USER  }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          
          scp -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no deploy-package.tar.gz $EC2_USER@$EC2_HOST:/tmp/
          ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST 'bash /home/$USER/foodbot/scripts/deploy.sh'

      - name: Health check
        run: |
          sleep 30
          curl -f https://${{  secrets.PRODUCTION_DOMAIN  }}/api/v1/health || exit 1

      - name: Rollback on failure
        if: failure()
        env:
          SSH_PRIVATE_KEY: ${{  secrets.SSH_PRIVATE_KEY  }}
          EC2_HOST: ${{  secrets.EC2_HOST  }}
          EC2_USER: ${{  secrets.EC2_USER  }}
        run: |
          ssh -i ~/.ssh/deploy_key.pem $EC2_USER@$EC2_HOST 'bash /home/$USER/foodbot/scripts/rollback.sh'
