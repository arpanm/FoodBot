# =============================================================================
# FoodBot - Security Scanning Pipeline
# =============================================================================
# Daily security scans for vulnerabilities, secrets, and compliance
# SAST, DAST, dependency scanning, and container scanning
# =============================================================================

name: Security Scan

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  # ---------------------------------------------------------------------------
  # Secret Scanning
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: GitLeaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for AWS credentials
        run: |
          if grep -r "AKIA[0-9A-Z]\{16\}" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::Found AWS credentials in code"
            exit 1
          fi
          echo "No AWS credentials found"

      - name: Check for private keys
        run: |
          if grep -r "BEGIN.*PRIVATE KEY" --exclude-dir=node_modules --exclude-dir=.git .; then
            echo "::error::Found private keys in code"
            exit 1
          fi
          echo "No private keys found"

  # ---------------------------------------------------------------------------
  # Dependency Vulnerability Scanning
  # ---------------------------------------------------------------------------
  dependency-scan:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run npm audit
        run: |
          pnpm audit --audit-level=moderate --json > npm-audit.json || true
          cat npm-audit.json

      - name: Snyk dependency scan
        if: ${{ secrets.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --json > snyk-report.json

      - name: Upload Snyk results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-report.json
          category: snyk-dependencies

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'FoodBot'
          path: '.'
          format: 'ALL'
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload OWASP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: |
            dependency-check-report.html
            dependency-check-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Maven Dependency Scan
  # ---------------------------------------------------------------------------
  maven-security-scan:
    name: Maven Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: OWASP Dependency Check (Maven)
        working-directory: services/mcp-orchestrator
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFiles=dependency-check-suppressions.xml

      - name: Upload Maven security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-security-report
          path: services/mcp-orchestrator/target/dependency-check-report.html
          retention-days: 30

  # ---------------------------------------------------------------------------
  # SAST (Static Application Security Testing)
  # ---------------------------------------------------------------------------
  sast-scan:
    name: SAST Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript, typescript, java
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: codeql-sast

      - name: SonarQube Scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=foodbot
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/build/**
            -Dsonar.tests=test
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
            p/nodejs
            p/typescript
            p/java
          generateSarif: true

      - name: Upload Semgrep results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------------
  # Container Image Scanning
  # ---------------------------------------------------------------------------
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      matrix:
        service:
          - backend
          - frontend
          - mcp
          - search
          - adapter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        run: |
          SERVICE="${{ matrix.service }}"
          case "$SERVICE" in
            backend)
              docker build -f apps/gateway-api/Dockerfile -t foodbot-$SERVICE:scan .
              ;;
            frontend)
              docker build -f apps/customer-app/Dockerfile -t foodbot-$SERVICE:scan .
              ;;
            mcp)
              docker build -f services/mcp-orchestrator/Dockerfile -t foodbot-$SERVICE:scan services/mcp-orchestrator/
              ;;
            search)
              docker build -f services/search-orchestrator/Dockerfile -t foodbot-$SERVICE:scan services/search-orchestrator/
              ;;
            adapter)
              docker build -f services/mcp-adapter/Dockerfile -t foodbot-$SERVICE:scan services/mcp-adapter/
              ;;
          esac

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: foodbot-${{ matrix.service }}:scan
          format: 'sarif'
          output: 'trivy-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          scanners: 'vuln,secret,config'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@v3
        with:
          image: foodbot-${{ matrix.service }}:scan
          fail-build: false
          severity-cutoff: high

      - name: Upload Grype results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-${{ matrix.service }}-results
          path: anchore-reports/
          retention-days: 30

      - name: Docker Scout CVE scan
        if: ${{ secrets.DOCKER_SCOUT_TOKEN != '' }}
        uses: docker/scout-action@v1
        with:
          command: cves
          image: foodbot-${{ matrix.service }}:scan
          sarif-file: scout-${{ matrix.service }}.sarif

  # ---------------------------------------------------------------------------
  # License Compliance Scanning
  # ---------------------------------------------------------------------------
  license-scan:
    name: License Compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: '8'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check licenses
        run: |
          npx license-checker --production --json > licenses.json
          cat licenses.json

      - name: Verify allowed licenses
        run: |
          # Check for forbidden licenses (GPL, AGPL, etc.)
          if grep -E "(GPL|AGPL|SSPL|CC-BY-NC)" licenses.json; then
            echo "::error::Found forbidden licenses"
            exit 1
          fi
          echo "All licenses are compliant"

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Infrastructure as Code Security
  # ---------------------------------------------------------------------------
  iac-scan:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkov IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: kubernetes,dockerfile,github_actions
          output_format: sarif
          output_file_path: checkov-report.sarif

      - name: Upload Checkov results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-report.sarif
          category: checkov-iac

      - name: Terrascan IaC scan
        uses: tenable/terrascan-action@main
        with:
          iac_type: 'k8s'
          iac_dir: 'k8s/'
          sarif_upload: true

  # ---------------------------------------------------------------------------
  # Security Report Summary
  # ---------------------------------------------------------------------------
  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - dependency-scan
      - sast-scan
      - container-scan
      - license-scan
      - iac-scan
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate security summary
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scan Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Secret Scan: ${{ needs.secret-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- SAST Scan: ${{ needs.sast-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Container Scan: ${{ needs.container-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- License Scan: ${{ needs.license-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- IaC Scan: ${{ needs.iac-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recommendations:" >> $GITHUB_STEP_SUMMARY
          echo "- Review all CRITICAL and HIGH severity findings" >> $GITHUB_STEP_SUMMARY
          echo "- Update vulnerable dependencies" >> $GITHUB_STEP_SUMMARY
          echo "- Check Security tab for detailed findings" >> $GITHUB_STEP_SUMMARY

      - name: Create issue for critical findings
        if: contains(needs.*.result, 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 Critical Security Findings Detected';
            const body = `
            ## Critical Security Scan Failures

            One or more security scans have detected critical issues.

            ### Failed Scans:
            - Secret Scan: ${{ needs.secret-scan.result }}
            - Dependency Scan: ${{ needs.dependency-scan.result }}
            - SAST Scan: ${{ needs.sast-scan.result }}
            - Container Scan: ${{ needs.container-scan.result }}

            Please review the [Security tab](https://github.com/${{ github.repository }}/security) for detailed findings.

            ### Action Required:
            1. Review all CRITICAL and HIGH severity findings
            2. Create remediation plan
            3. Update dependencies and fix vulnerabilities
            4. Re-run security scan

            **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            `;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'critical', 'automated']
            });

      - name: Notify security team
        if: contains(needs.*.result, 'failure') && secrets.SECURITY_SLACK_WEBHOOK != ''
        run: |
          curl -X POST ${{ secrets.SECURITY_SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{
              "attachments": [{
                "color": "danger",
                "title": "🚨 Critical Security Findings",
                "text": "Security scans detected critical vulnerabilities",
                "fields": [
                  {"title": "Repository", "value": "${{ github.repository }}", "short": true},
                  {"title": "Branch", "value": "${{ github.ref_name }}", "short": true}
                ]
              }]
            }'
