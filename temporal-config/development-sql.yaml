# Temporal dynamic configuration for development
# See: https://docs.temporal.io/references/dynamic-configuration

system.forceSearchAttributesCacheRefreshOnRead:
  - value: true
    constraints: {}

limit.maxIDLength:
  - value: 255
    constraints: {}

history.maximumSignalsPerExecution:
  - value: 10000
    constraints: {}

frontend.keepAliveMaxConnectionIdle:
  - value: 60s
    constraints: {}

frontend.keepAliveMaxConnectionAge:
  - value: 300s
    constraints: {}
