<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FoodBot - AI Food Ordering</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }

    .container {
      padding: 20px;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      margin-bottom: 16px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #555;
    }

    .input-group input,
    .input-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .input-group input:focus,
    .input-group textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .input-group textarea {
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }

    .status.info {
      background: #e6f3ff;
      color: #0066cc;
    }

    .status.success {
      background: #e6ffe6;
      color: #00cc00;
    }

    .status.error {
      background: #ffe6e6;
      color: #cc0000;
    }

    .status.hidden {
      display: none;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .footer {
      text-align: center;
      color: white;
      font-size: 12px;
      margin-top: 16px;
      opacity: 0.8;
    }

    .session-info {
      font-size: 12px;
      color: #666;
      margin-top: 8px;
    }

    .link {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
    }

    .link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>FoodBot</h1>
      <p>AI-Powered Food Ordering</p>
    </div>

    <div class="card">
      <form id="orderForm">
        <div class="input-group">
          <label for="userMessage">What would you like to order?</label>
          <textarea
            id="userMessage"
            placeholder="E.g., I want to order a large pepperoni pizza from Domino's"
            required
          ></textarea>
        </div>

        <div class="input-group">
          <label for="location">Your Location (optional)</label>
          <input
            type="text"
            id="location"
            placeholder="E.g., Koramangala, Bangalore"
          />
        </div>

        <button type="submit" class="btn btn-primary" id="startOrderBtn">
          Start Order
        </button>
      </form>

      <div id="status" class="status hidden"></div>

      <div id="sessionInfo" class="session-info hidden"></div>
    </div>

    <div class="footer">
      <p>Powered by Claude AI</p>
      <p style="margin-top: 4px;">
        <a href="#" class="link" id="settingsLink">Settings</a> |
        <a href="#" class="link" id="helpLink">Help</a>
      </p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
