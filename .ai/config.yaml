entry_context:
  - .ai/context/product-spec.md
  - .ai/orchestration/claude-multi-agent.md

execution_rules:
  - enforce_spec_driven: true
  - require_tests: true
  - allow_self_heal: true

llm_routing:
planner: claude
validation: openai
fast_tasks: gemini

memory_store: .ai/memory

skills_dir: .ai/skills
plugins_dir: .ai/plugins

execution_pipeline:
  - requirement
  - architecture
  - planning
  - codegen
  - testgen
  - testrun
  - review
  - security
  - fix

quality_gates:
  min_test_coverage: 80
  max_retry_iterations: 3
  security_block_on_high: true
