global:
  resolve_timeout: 5m
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@foodbot.local'
  smtp_auth_username: ''
  smtp_auth_password: ''
  smtp_require_tls: false

# Route tree
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'critical'
      continue: true

    - match:
        severity: warning
      receiver: 'warning'

# Receivers
receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://host.docker.internal:8090/alerts'
        send_resolved: true

  - name: 'critical'
    webhook_configs:
      - url: 'http://host.docker.internal:8090/alerts/critical'
        send_resolved: true
    # Email configuration (optional)
    # email_configs:
    #   - to: 'oncall@foodbot.com'
    #     headers:
    #       Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'

  - name: 'warning'
    webhook_configs:
      - url: 'http://host.docker.internal:8090/alerts/warning'
        send_resolved: true

# Inhibition rules
inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
