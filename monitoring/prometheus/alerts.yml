groups:
  # ============================================
  # Application Alerts
  # ============================================
  - name: application
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(foodbot_http_request_errors_total[5m]))
            /
            sum(rate(foodbot_http_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          component: backend
        annotations:
          summary: 'High error rate detected'
          description: 'Error rate is {{ $value | humanizePercentage }} (threshold: 5%)'

      # Slow response time
      - alert: SlowResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(foodbot_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
          component: backend
        annotations:
          summary: 'Slow API response time'
          description: 'P95 response time is {{ $value }}s (threshold: 1s)'

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'Service {{ $labels.job }} is down'
          description: 'Service has been down for more than 2 minutes'

  # ============================================
  # Database Alerts
  # ============================================
  - name: database
    interval: 30s
    rules:
      # Database connection pool exhaustion
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          foodbot_db_connection_pool{state="active"} /
          foodbot_db_connection_pool{state="total"} > 0.8
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: 'Database connection pool near exhaustion'
          description: 'Pool usage is {{ $value | humanizePercentage }}'

      # Slow database queries
      - alert: SlowDatabaseQueries
        expr: |
          histogram_quantile(0.95,
            sum(rate(foodbot_db_query_duration_seconds_bucket[5m])) by (le)
          ) > 1
        for: 10m
        labels:
          severity: warning
          component: database
        annotations:
          summary: 'Slow database queries detected'
          description: 'P95 query time is {{ $value }}s'

  # ============================================
  # Cache Alerts
  # ============================================
  - name: cache
    interval: 30s
    rules:
      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: |
          (
            sum(rate(foodbot_cache_hits_total[5m]))
            /
            (sum(rate(foodbot_cache_hits_total[5m])) + sum(rate(foodbot_cache_misses_total[5m])))
          ) < 0.5
        for: 15m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: 'Low cache hit rate'
          description: 'Cache hit rate is {{ $value | humanizePercentage }} (threshold: 50%)'

  # ============================================
  # Infrastructure Alerts
  # ============================================
  - name: infrastructure
    interval: 30s
    rules:
      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: 'High CPU usage on {{ $labels.instance }}'
          description: 'CPU usage is {{ $value }}%'

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 10m
        labels:
          severity: warning
          component: infrastructure
        annotations:
          summary: 'High memory usage on {{ $labels.instance }}'
          description: 'Memory usage is {{ $value }}%'
