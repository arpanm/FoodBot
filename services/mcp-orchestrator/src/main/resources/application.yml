spring:
  application:
    name: mcp-orchestrator

  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

    # Elasticsearch Configuration
    elasticsearch:
      uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
      username: ${ELASTICSEARCH_USERNAME:}
      password: ${ELASTICSEARCH_PASSWORD:}
      connection-timeout: 5s
      socket-timeout: 30s

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: mcp-indexer
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.foodbot.mcp.model
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3

  # Jackson Configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# Server Configuration
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /mcp/v1
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always

# Security Configuration
security:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
    allowed-methods: ${ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${ALLOWED_HEADERS:Content-Type,Authorization,X-Request-ID}
    exposed-headers: ${EXPOSED_HEADERS:X-Request-ID}
    allow-credentials: ${ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:86400}

# MCP Provider Configuration
mcp:
  providers:
    mock:
      enabled: true
      base-url: ${MOCK_MCP_BASE_URL:http://localhost:3010}
      timeout: 5000ms
      retry:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
    swiggy:
      enabled: ${SWIGGY_MCP_ENABLED:false}
      base-url: ${SWIGGY_MCP_BASE_URL:https://api.swiggy.com/mcp}
      api-key: ${SWIGGY_API_KEY:}
      timeout: 10000ms
      retry:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
    zomato:
      enabled: ${ZOMATO_MCP_ENABLED:false}
      base-url: ${ZOMATO_MCP_BASE_URL:https://api.zomato.com/mcp}
      api-key: ${ZOMATO_API_KEY:}
      timeout: 10000ms
      retry:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2

  # Health Check Configuration
  health-check:
    enabled: true
    interval: 60s
    timeout: 5s

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - java.io.IOException
    instances:
      mock-mcp:
        baseConfig: default
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
      swiggy-mcp:
        baseConfig: default
        slidingWindowSize: 20
        failureRateThreshold: 60
        waitDurationInOpenState: 120s
      zomato-mcp:
        baseConfig: default
        slidingWindowSize: 20
        failureRateThreshold: 60
        waitDurationInOpenState: 120s

  ratelimiter:
    configs:
      default:
        registerHealthIndicator: true
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0s
    instances:
      mock-mcp:
        baseConfig: default
        limitForPeriod: 100
      swiggy-mcp:
        baseConfig: default
        limitForPeriod: 50
      zomato-mcp:
        baseConfig: default
        limitForPeriod: 50

  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 10
        maxWaitDuration: 1s
    instances:
      mock-mcp:
        baseConfig: default
        maxConcurrentCalls: 10
      swiggy-mcp:
        baseConfig: default
        maxConcurrentCalls: 10
      zomato-mcp:
        baseConfig: default
        maxConcurrentCalls: 10

  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
        ignoreExceptions:
          - com.foodbot.mcp.exception.ProviderUnavailableException
    instances:
      mock-mcp:
        baseConfig: default
      swiggy-mcp:
        baseConfig: default
      zomato-mcp:
        baseConfig: default

# Cache Configuration
cache:
  ttl:
    search-results: 600s  # 10 minutes
    restaurant-details: 900s  # 15 minutes
    dish-availability: 300s  # 5 minutes
    filters: 1800s  # 30 minutes
  hit-rate-target: 0.6

# Elasticsearch Index Configuration
elasticsearch:
  indices:
    restaurants:
      name: restaurants
      shards: 5
      replicas: 1
    dishes:
      name: dishes
      shards: 5
      replicas: 1
  bulk:
    size: 100
    flush-interval: 5s

# Kafka Topics
kafka:
  topics:
    restaurant-created: restaurant.created
    restaurant-updated: restaurant.updated
    menu-updated: menu.updated
    dish-availability-changed: dish.availability.changed

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# Logging Configuration
logging:
  level:
    root: INFO
    com.foodbot.mcp: DEBUG
    org.springframework.data.elasticsearch: DEBUG
    org.elasticsearch.client: DEBUG
    io.github.resilience4j: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/mcp-orchestrator.log
    max-size: 10MB
    max-history: 30

# Swagger/OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
