# ============================================
# Application Secrets
# IMPORTANT: This is a template. In production:
# 1. Use sealed-secrets or external secret managers (Vault, AWS Secrets Manager)
# 2. Never commit real secrets to git
# 3. Base64 encode all values: echo -n 'value' | base64
# ============================================
apiVersion: v1
kind: Secret
metadata:
  name: foodbot-secrets
  namespace: foodbot
  labels:
    app: foodbot
    component: secrets
type: Opaque
data:
  # Database credentials (base64 encoded)
  # Example: echo -n 'postgres' | base64
  DB_USERNAME: cG9zdGdyZXM=  # postgres
  DB_PASSWORD: cG9zdGdyZXM=  # postgres

  # Redis password (base64 encoded)
  # Example: echo -n 'foodbot-redis-password' | base64
  REDIS_PASSWORD: Zm9vZGJvdC1yZWRpcy1wYXNzd29yZA==

  # JWT Secret (base64 encoded)
  # Example: echo -n 'your-super-secret-jwt-key-change-in-production' | base64
  JWT_SECRET: eW91ci1zdXBlci1zZWNyZXQtand0LWtleS1jaGFuZ2UtaW4tcHJvZHVjdGlvbg==

  # SMTP Credentials (base64 encoded)
  SMTP_USER: ""
  SMTP_PASSWORD: ""

  # SMS Provider API Key (base64 encoded)
  SMS_PROVIDER_API_KEY: ""

  # Grafana Admin Password (base64 encoded)
  GRAFANA_PASSWORD: YWRtaW4=  # admin

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
  namespace: foodbot
  labels:
    app: postgres
    component: database
type: Opaque
data:
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  POSTGRES_DB: Zm9vZGJvdA==

---
apiVersion: v1
kind: Secret
metadata:
  name: temporal-postgres-secrets
  namespace: foodbot
  labels:
    app: temporal
    component: database
type: Opaque
data:
  POSTGRES_USER: dGVtcG9yYWw=  # temporal
  POSTGRES_PASSWORD: dGVtcG9yYWw=  # temporal
