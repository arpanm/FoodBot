apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: foodbot-postgres-pvc
  namespace: foodbot
  labels:
    app: postgres
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard

