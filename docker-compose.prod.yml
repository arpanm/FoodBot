version: '3.8'

# ============================================
# Production Docker Compose Configuration
# Multi-service orchestration with:
# - Resource limits
# - Health checks
# - Auto-scaling ready
# - Monitoring (Prometheus + Grafana)
# - Load balancing (Nginx)
# - High availability
# ============================================

x-common-settings: &common-settings
  restart: unless-stopped
  networks:
    - foodbot-network
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # ============================================
  # Load Balancer - Nginx
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: foodbot-nginx-lb
    <<: *common-settings
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    depends_on:
      gateway-api-1:
        condition: service_healthy
      gateway-api-2:
        condition: service_healthy
      gateway-api-3:
        condition: service_healthy
      customer-app:
        condition: service_healthy
      restaurant-app:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # Gateway API - 3 Replicas for HA
  # ============================================
  gateway-api-1:
    build:
      context: .
      dockerfile: apps/gateway-api/Dockerfile
    image: foodbot/gateway-api:latest
    container_name: foodbot-gateway-api-1
    <<: *common-settings
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: foodbot-db
      DB_PORT: 5432
      DB_NAME: foodbot
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-foodbot-redis-password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 1h
      TEMPORAL_ADDRESS: temporal:7233
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: info
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100
    depends_on:
      foodbot-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  gateway-api-2:
    build:
      context: .
      dockerfile: apps/gateway-api/Dockerfile
    image: foodbot/gateway-api:latest
    container_name: foodbot-gateway-api-2
    <<: *common-settings
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: foodbot-db
      DB_PORT: 5432
      DB_NAME: foodbot
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-foodbot-redis-password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 1h
      TEMPORAL_ADDRESS: temporal:7233
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: info
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100
    depends_on:
      foodbot-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  gateway-api-3:
    build:
      context: .
      dockerfile: apps/gateway-api/Dockerfile
    image: foodbot/gateway-api:latest
    container_name: foodbot-gateway-api-3
    <<: *common-settings
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: foodbot-db
      DB_PORT: 5432
      DB_NAME: foodbot
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-foodbot-redis-password}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: 1h
      TEMPORAL_ADDRESS: temporal:7233
      KAFKA_BROKERS: kafka:9092
      LOG_LEVEL: info
      RATE_LIMIT_TTL: 60
      RATE_LIMIT_MAX: 100
    depends_on:
      foodbot-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================
  # Customer App - Frontend
  # ============================================
  customer-app:
    build:
      context: .
      dockerfile: apps/customer-app/Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-https://api.foodbot.com}
        REACT_APP_ENV: production
    image: foodbot/customer-app:latest
    container_name: foodbot-customer-app
    <<: *common-settings
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # Restaurant App - Frontend
  # ============================================
  restaurant-app:
    build:
      context: .
      dockerfile: apps/restaurant-app/Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-https://api.foodbot.com}
        REACT_APP_ENV: production
    image: foodbot/restaurant-app:latest
    container_name: foodbot-restaurant-app
    <<: *common-settings
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================
  # Search Orchestrator
  # ============================================
  search-orchestrator:
    build:
      context: .
      dockerfile: services/search-orchestrator/Dockerfile
    image: foodbot/search-orchestrator:latest
    container_name: foodbot-search-orchestrator
    <<: *common-settings
    environment:
      PORT: 3002
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-foodbot-redis-password}
      ELASTICSEARCH_NODE: http://elasticsearch:9200
      ELASTICSEARCH_INDEX: foodbot_restaurants
      MCP_ADAPTER_URL: http://mcp-adapter:8082/api/v1
      DB_HOST: foodbot-db
      DB_PORT: 5432
      DB_NAME: foodbot
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      ES_TIMEOUT_MS: 200
      MCP_TIMEOUT_MS: 2000
      DB_TIMEOUT_MS: 500
      MAX_TOTAL_TIMEOUT_MS: 3000
      DEFAULT_SEARCH_STRATEGY: comprehensive
      CACHE_TTL_SECONDS: 300
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      foodbot-db:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================
  # MCP Adapter
  # ============================================
  mcp-adapter:
    build:
      context: .
      dockerfile: services/mcp-adapter/Dockerfile.prod
    image: foodbot/mcp-adapter:latest
    container_name: foodbot-mcp-adapter
    <<: *common-settings
    environment:
      PORT: 8082
      NODE_ENV: production
      LOG_LEVEL: info
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ============================================
  # Notification Service
  # ============================================
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    image: foodbot/notification-service:latest
    container_name: foodbot-notification-service
    <<: *common-settings
    environment:
      PORT: 3003
      NODE_ENV: production
      KAFKA_BROKERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-foodbot-redis-password}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMS_PROVIDER_API_KEY: ${SMS_PROVIDER_API_KEY}
      LOG_LEVEL: info
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ============================================
  # PostgreSQL - Application Database
  # ============================================
  foodbot-db:
    image: postgres:16-alpine
    container_name: foodbot-app-db
    <<: *common-settings
    environment:
      POSTGRES_DB: foodbot
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.utf8"
    volumes:
      - foodbot-db-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=1MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d foodbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================================
  # PostgreSQL - Temporal Database
  # ============================================
  postgresql:
    image: postgres:15-alpine
    container_name: foodbot-temporal-db
    <<: *common-settings
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U temporal']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================
  # Redis - Caching & Session Storage
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: foodbot-redis
    <<: *common-settings
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-foodbot-redis-password}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --save 300 100
      --save 600 10
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================
  # Temporal Server
  # ============================================
  temporal:
    image: temporalio/auto-setup:1.22.4
    container_name: foodbot-temporal
    <<: *common-settings
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
      - ENABLE_ES=false
    volumes:
      - ./temporal-config:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ['CMD', 'tctl', '--address', 'temporal:7233', 'cluster', 'health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 1.5G

  # ============================================
  # Elasticsearch - Search Engine
  # ============================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: foodbot-elasticsearch
    <<: *common-settings
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================================
  # Kafka & Zookeeper
  # ============================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: foodbot-zookeeper
    <<: *common-settings
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SYNC_LIMIT: 2
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log
    healthcheck:
      test: ['CMD', 'bash', '-c', 'echo "ruok" | nc localhost 2181']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: foodbot-kafka
    <<: *common-settings
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_COMPRESSION_TYPE: 'lz4'
      KAFKA_NUM_NETWORK_THREADS: 8
      KAFKA_NUM_IO_THREADS: 8
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', 'kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '1'
          memory: 2G

  # ============================================
  # Monitoring - Prometheus
  # ============================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: foodbot-prometheus
    <<: *common-settings
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================
  # Monitoring - Grafana
  # ============================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: foodbot-grafana
    <<: *common-settings
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ============================================
  # Node Exporter - System Metrics
  # ============================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: foodbot-node-exporter
    <<: *common-settings
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

# ============================================
# Networks
# ============================================
networks:
  foodbot-network:
    driver: bridge
    name: foodbot-network
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================
# Volumes
# ============================================
volumes:
  foodbot-db-data:
    name: foodbot-app-db-data
  postgres-data:
    name: foodbot-postgres-data
  redis-data:
    name: foodbot-redis-data
  elasticsearch-data:
    name: foodbot-elasticsearch-data
  kafka-data:
    name: foodbot-kafka-data
  zookeeper-data:
    name: foodbot-zookeeper-data
  zookeeper-logs:
    name: foodbot-zookeeper-logs
  prometheus-data:
    name: foodbot-prometheus-data
  grafana-data:
    name: foodbot-grafana-data
  nginx-cache:
    name: foodbot-nginx-cache
  nginx-logs:
    name: foodbot-nginx-logs
