# SonarQube Configuration for FoodBot

# Project identification
sonar.projectKey=foodbot
sonar.projectName=FoodBot - Agentic Restaurant Commerce Platform
sonar.projectVersion=1.0.0

# Source code
sonar.sources=apps,services,packages
sonar.tests=apps,services,packages

# Test patterns
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.generated.ts

# Coverage reports
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/integration/lcov.info
sonar.testExecutionReportPaths=test-results/sonar-report.xml

# Language
sonar.language=ts
sonar.sourceEncoding=UTF-8

# TypeScript specific
sonar.typescript.tsconfigPath=tsconfig.json

# Code quality gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Quality thresholds
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.config.ts,**/*.config.js

# Duplication
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Issue detection
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignore TODOs in markdown files
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.md

# Ignore console statements in scripts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2228
sonar.issue.ignore.multicriteria.e2.resourceKey=**/scripts/**/*.ts

# Ignore complexity in generated files
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.generated.ts

# Links
sonar.links.homepage=https://github.com/foodbot/foodbot
sonar.links.ci=https://github.com/foodbot/foodbot/actions
sonar.links.issue=https://github.com/foodbot/foodbot/issues
sonar.links.scm=https://github.com/foodbot/foodbot

# SCM
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

# Analysis mode
sonar.analysis.mode=publish
